name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  app:
    name: App build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build/app
          key: app-${{ runner.os }}-${{ hashFiles('App/**', 'Sources/**', 'Package.swift') }}
          restore-keys: app-${{ runner.os }}-
      - run: brew install xcodegen
      - run: |
          xcodegen generate --spec App/project.yml
          xcodebuild build -project App/PokerChipCase.xcodeproj -scheme PokerChipCase -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/app CODE_SIGNING_ALLOWED=NO -quiet
