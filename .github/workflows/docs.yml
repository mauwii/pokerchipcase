name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the DocC archives
        run: xcodebuild docbuild -scheme PokerChipCase-Package -destination 'generic/platform=macOS' -derivedDataPath .build/docs OTHER_DOCC_FLAGS=--warnings-as-errors -quiet
      - name: Merge the archives
        run: |
          xcrun docc merge \
            .build/docs/Build/Products/Debug/PokerCore.doccarchive \
            .build/docs/Build/Products/Debug/PokerNet.doccarchive \
            .build/docs/Build/Products/Debug/PokerSession.doccarchive \
            --synthesized-landing-page-name PokerChipCase \
            --synthesized-landing-page-kind Package \
            --output-path .build/PokerChipCase.doccarchive
      - name: Transform for static hosting
        run: xcrun docc process-archive transform-for-static-hosting .build/PokerChipCase.doccarchive --output-path .build/site --hosting-base-path pokerchipcase
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/site
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
