sonar.projectKey=mauwii_pokerchipcase
sonar.organization=mauwii

# SonarCloud analyzes the whole repo and ignores sonar.sources, sonar.tests and
# sonar.test.inclusions; only exclusions narrow the scope
sonar.exclusions=docs/images/**

# written by the CI job test
sonar.swift.coverage.reportPaths=coverage.report
# analyzed for issues only: the SwiftUI app has no unit tests by design, and the
# tests are not code to cover
sonar.coverage.exclusions=App/Sources/**,Tests/**
# fail the scan step, and with it the job test, on a red quality gate
sonar.qualitygate.wait=true
